<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Prediction System - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .visualization-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            min-height: 600px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2d3748;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f7fafc;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-dot.success { background: #48bb78; }
        .status-dot.error { background: #f56565; }
        .status-dot.loading { background: #ed8936; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
        }

        .metric-label {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 5px;
        }

        .predictions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .predictions-table th,
        .predictions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .predictions-table th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }

        .predictions-table tr:hover {
            background: #f7fafc;
        }

        .confidence-high { color: #48bb78; }
        .confidence-medium { color: #ed8936; }
        .confidence-low { color: #f56565; }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }

        .tab:hover {
            background: #f7fafc;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        .alert-info {
            background: #bee3f8;
            color: #2a4365;
            border: 1px solid #90cdf4;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> Advanced Prediction System</h1>
            <p>Multi-Model Ensemble Cryptocurrency Forecasting Dashboard</p>
        </div>

        <div class="dashboard-grid">
            <!-- Control Panel -->
            <div class="control-panel">
                <div class="section">
                    <h3><i class="fas fa-cogs"></i> Model Training</h3>
                    <div class="form-group">
                        <label for="train-symbol">Cryptocurrency:</label>
                        <select id="train-symbol">
                            <option value="ETH">Ethereum (ETH)</option>
                            <option value="BTC">Bitcoin (BTC)</option>
                            <option value="ADA">Cardano (ADA)</option>
                            <option value="DOT">Polkadot (DOT)</option>
                            <option value="LINK">Chainlink (LINK)</option>
                            <option value="UNI">Uniswap (UNI)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="train-currency">Currency:</label>
                        <select id="train-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <button onclick="trainModels()" id="train-btn" class="btn btn-primary">
                        <i class="fas fa-play"></i> Train Models
                    </button>
                    <div id="train-status" class="status-indicator" style="display: none;">
                        <div class="status-dot loading"></div>
                        <span>Training models...</span>
                    </div>
                </div>

                <div class="section">
                    <h3><i class="fas fa-chart-line"></i> Predictions</h3>
                    <div class="form-group">
                        <label for="predict-symbol">Cryptocurrency:</label>
                        <select id="predict-symbol">
                            <option value="ETH">Ethereum (ETH)</option>
                            <option value="BTC">Bitcoin (BTC)</option>
                            <option value="ADA">Cardano (ADA)</option>
                            <option value="DOT">Polkadot (DOT)</option>
                            <option value="LINK">Chainlink (LINK)</option>
                            <option value="UNI">Uniswap (UNI)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="predict-currency">Currency:</label>
                        <select id="predict-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="predict-steps">Prediction Steps:</label>
                        <input type="number" id="predict-steps" value="10" min="1" max="50">
                    </div>
                    <button onclick="getPredictions()" id="predict-btn" class="btn btn-success">
                        <i class="fas fa-magic"></i> Generate Predictions
                    </button>
                    <div id="predict-status" class="status-indicator" style="display: none;">
                        <div class="status-dot loading"></div>
                        <span>Generating predictions...</span>
                    </div>
                </div>

                <div class="section">
                    <h3><i class="fas fa-chart-bar"></i> Performance</h3>
                    <div class="form-group">
                        <label for="performance-symbol">Cryptocurrency:</label>
                        <select id="performance-symbol">
                            <option value="ETH">Ethereum (ETH)</option>
                            <option value="BTC">Bitcoin (BTC)</option>
                            <option value="ADA">Cardano (ADA)</option>
                            <option value="DOT">Polkadot (DOT)</option>
                            <option value="LINK">Chainlink (LINK)</option>
                            <option value="UNI">Uniswap (UNI)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="performance-currency">Currency:</label>
                        <select id="performance-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <button onclick="getPerformance()" id="performance-btn" class="btn btn-info">
                        <i class="fas fa-analytics"></i> View Performance
                    </button>
                    <div id="performance-status" class="status-indicator" style="display: none;">
                        <div class="status-dot loading"></div>
                        <span>Loading performance...</span>
                    </div>
                </div>
            </div>

            <!-- Visualization Panel -->
            <div class="visualization-panel">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('predictions')">
                        <i class="fas fa-chart-line"></i> Predictions
                    </div>
                    <div class="tab" onclick="switchTab('performance')">
                        <i class="fas fa-chart-bar"></i> Model Performance
                    </div>
                    <div class="tab" onclick="switchTab('metrics')">
                        <i class="fas fa-tachometer-alt"></i> Metrics
                    </div>
                </div>

                <!-- Predictions Tab -->
                <div id="predictions-tab" class="tab-content active">
                    <div class="chart-container">
                        <canvas id="predictionsChart"></canvas>
                    </div>
                    <div id="predictions-table-container"></div>
                </div>

                <!-- Performance Tab -->
                <div id="performance-tab" class="tab-content">
                    <div class="chart-container">
                        <canvas id="performanceChart"></canvas>
                    </div>
                    <div id="performance-metrics" class="metrics-grid"></div>
                </div>

                <!-- Metrics Tab -->
                <div id="metrics-tab" class="tab-content">
                    <div class="chart-container">
                        <canvas id="metricsChart"></canvas>
                    </div>
                    <div id="model-weights" class="metrics-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let predictionsChart = null;
        let performanceChart = null;
        let metricsChart = null;
        let currentData = {};

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        // API functions
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                return await response.json();
            } catch (error) {
                throw new Error(`Request failed: ${error.message}`);
            }
        }

        function showStatus(elementId, message, type = 'loading') {
            const element = document.getElementById(elementId);
            const dot = element.querySelector('.status-dot');
            const text = element.querySelector('span');
            
            element.style.display = 'flex';
            dot.className = `status-dot ${type}`;
            text.textContent = message;
        }

        function hideStatus(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }

        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            const container = document.querySelector('.visualization-panel');
            container.insertBefore(alert, container.firstChild);
            
            setTimeout(() => alert.remove(), 5000);
        }

        // Chart functions
        function createPredictionsChart(data) {
            const ctx = document.getElementById('predictionsChart').getContext('2d');
            
            if (predictionsChart) {
                predictionsChart.destroy();
            }

            const labels = data.predictions.map((_, index) => `Step ${index + 1}`);
            const prices = data.predictions.map(p => p.predicted_price);
            const confidences = data.predictions.map(p => p.confidence);

            predictionsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Predicted Price',
                        data: prices,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Confidence (scaled)',
                        data: confidences.map(c => c * 100),
                        borderColor: '#48bb78',
                        backgroundColor: 'rgba(72, 187, 120, 0.1)',
                        borderWidth: 2,
                        yAxisID: 'y1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: `${data.symbol}/${data.currency} Price Predictions`,
                            font: { size: 16 }
                        },
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Price ($)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Confidence (%)'
                            },
                            grid: {
                                drawOnChartArea: false,
                            },
                        }
                    }
                }
            });
        }

        function createPerformanceChart(data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            if (performanceChart) {
                performanceChart.destroy();
            }

            const models = Object.keys(data.model_performance);
            const rmseValues = models.map(model => data.model_performance[model].RMSE || 0);

            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: models.map(m => m.toUpperCase()),
                    datasets: [{
                        label: 'RMSE (Lower is Better)',
                        data: rmseValues,
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(72, 187, 120, 0.8)',
                            'rgba(237, 137, 54, 0.8)',
                            'rgba(245, 101, 101, 0.8)'
                        ],
                        borderColor: [
                            'rgba(102, 126, 234, 1)',
                            'rgba(72, 187, 120, 1)',
                            'rgba(237, 137, 54, 1)',
                            'rgba(245, 101, 101, 1)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Model Performance Comparison',
                            font: { size: 16 }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'RMSE'
                            }
                        }
                    }
                }
            });
        }

        function createMetricsChart(data) {
            const ctx = document.getElementById('metricsChart').getContext('2d');
            
            if (metricsChart) {
                metricsChart.destroy();
            }

            const models = Object.keys(data.model_weights);
            const weights = Object.values(data.model_weights);

            metricsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: models.map(m => m.toUpperCase()),
                    datasets: [{
                        data: weights,
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(72, 187, 120, 0.8)',
                            'rgba(237, 137, 54, 0.8)',
                            'rgba(245, 101, 101, 0.8)'
                        ],
                        borderColor: [
                            'rgba(102, 126, 234, 1)',
                            'rgba(72, 187, 120, 1)',
                            'rgba(237, 137, 54, 1)',
                            'rgba(245, 101, 101, 1)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Model Weights Distribution',
                            font: { size: 16 }
                        },
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Main functions
        async function trainModels() {
            const symbol = document.getElementById('train-symbol').value;
            const currency = document.getElementById('train-currency').value;
            
            showStatus('train-status', 'Training models...', 'loading');
            
            try {
                const result = await makeRequest('/api/models/train', {
                    method: 'POST',
                    body: JSON.stringify({ symbol, currency })
                });
                
                if (result.success) {
                    showStatus('train-status', 'Models trained successfully!', 'success');
                    showAlert('Models trained successfully!', 'success');
                    
                    // Update other dropdowns
                    document.getElementById('predict-symbol').value = symbol;
                    document.getElementById('predict-currency').value = currency;
                    document.getElementById('performance-symbol').value = symbol;
                    document.getElementById('performance-currency').value = currency;
                } else {
                    showStatus('train-status', 'Training failed', 'error');
                    showAlert(result.message || 'Training failed', 'error');
                }
            } catch (error) {
                showStatus('train-status', 'Training failed', 'error');
                showAlert(error.message, 'error');
            }
        }

        async function getPredictions() {
            const symbol = document.getElementById('predict-symbol').value;
            const currency = document.getElementById('predict-currency').value;
            const steps = parseInt(document.getElementById('predict-steps').value);
            
            showStatus('predict-status', 'Generating predictions...', 'loading');
            
            try {
                const result = await makeRequest('/api/predict/advanced', {
                    method: 'POST',
                    body: JSON.stringify({ symbol, currency, steps })
                });
                
                if (result.success) {
                    showStatus('predict-status', 'Predictions generated!', 'success');
                    showAlert('Predictions generated successfully!', 'success');
                    
                    currentData.predictions = result;
                    createPredictionsChart(result);
                    createPredictionsTable(result);
                    
                    // Switch to predictions tab
                    switchTab('predictions');
                } else {
                    showStatus('predict-status', 'Prediction failed', 'error');
                    showAlert(result.error || 'Prediction failed', 'error');
                }
            } catch (error) {
                showStatus('predict-status', 'Prediction failed', 'error');
                showAlert(error.message, 'error');
            }
        }

        async function getPerformance() {
            const symbol = document.getElementById('performance-symbol').value;
            const currency = document.getElementById('performance-currency').value;
            
            showStatus('performance-status', 'Loading performance...', 'loading');
            
            try {
                const result = await makeRequest(`/api/models/performance?symbol=${symbol}&currency=${currency}`);
                
                if (result.success) {
                    showStatus('performance-status', 'Performance loaded!', 'success');
                    showAlert('Performance metrics loaded!', 'success');
                    
                    currentData.performance = result.data;
                    createPerformanceChart(result.data);
                    createPerformanceMetrics(result.data);
                    createMetricsChart(result.data);
                    
                    // Switch to performance tab
                    switchTab('performance');
                } else {
                    showStatus('performance-status', 'Failed to load performance', 'error');
                    showAlert(result.message || 'Failed to load performance', 'error');
                }
            } catch (error) {
                showStatus('performance-status', 'Failed to load performance', 'error');
                showAlert(error.message, 'error');
            }
        }

        function createPredictionsTable(data) {
            const container = document.getElementById('predictions-table-container');
            
            let html = `
                <h3>Detailed Predictions</h3>
                <table class="predictions-table">
                    <thead>
                        <tr>
                            <th>Step</th>
                            <th>Predicted Price</th>
                            <th>Confidence</th>
                            <th>Model Breakdown</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            data.predictions.forEach(pred => {
                const confidenceClass = pred.confidence > 0.8 ? 'confidence-high' : 
                                      pred.confidence > 0.6 ? 'confidence-medium' : 'confidence-low';
                
                html += `
                    <tr>
                        <td><strong>${pred.step}</strong></td>
                        <td><strong>$${pred.predicted_price.toFixed(2)}</strong></td>
                        <td class="${confidenceClass}">${(pred.confidence * 100).toFixed(1)}%</td>
                        <td>
                            ${Object.entries(pred.model_breakdown || {}).map(([model, price]) => 
                                `${model}: $${price.toFixed(2)}`
                            ).join('<br>')}
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function createPerformanceMetrics(data) {
            const container = document.getElementById('performance-metrics');
            
            let html = '';
            
            Object.entries(data.model_performance).forEach(([model, metrics]) => {
                html += `
                    <div class="metric-card">
                        <div class="metric-value">${metrics.RMSE?.toFixed(2) || 'N/A'}</div>
                        <div class="metric-label">${model.toUpperCase()} RMSE</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set default values
